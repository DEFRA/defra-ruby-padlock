# Project key is required. You'll find it in the SonarCloud UI
sonar.projectKey=DEFRA_defra-ruby-padlock
sonar.organization=defra

# This is the name and version displayed in the SonarCloud UI
sonar.projectName=defra-ruby-padlock

# This will add the same links in the SonarCloud UI
sonar.links.homepage=https://github.com/DEFRA/defra-ruby-padlock
sonar.links.ci=https://github.com/DEFRA/defra-ruby-padlock/actions
sonar.links.scm=https://github.com/DEFRA/defra-ruby-padlock
sonar.links.issue=https://github.com/DEFRA/ruby-services-team/issues

sonar.sources=./lib
sonar.tests=./spec

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.ruby.coverage.reportPaths=coverage/coverage.json
sonar.ruby.rubocop.reportPaths=rubocop-result.json
